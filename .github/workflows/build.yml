name: Check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y gettext qt6-declarative-dev-tools qml6-module-qtquick qml6-module-qttest libqt6quicktest6
      - name: Logic tests
        run: tools/test-package.sh
      - name: Translations compile
        run: tools/build-translations.sh
      - name: Package
        run: tools/make-package.sh
